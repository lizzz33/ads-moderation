services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moderation
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/migrations/V001__initial.sql:/docker-entrypoint-initdb.d/V001__initial.sql
      - ./app/db/migrations/V002__add_is_closed.sql:/docker-entrypoint-initdb.d/V002__add_is_closed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moderation"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root file:///mlruns
      --allowed-hosts "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    build: .
    ports:
      - "8003:8003"
    environment:
      USE_MLFLOW: "true"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: moderation
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      KAFKA_BOOTSTRAP: redpanda:29092
      TOPIC: moderation
      DLQ_TOPIC: moderation_dlq
      CONSUMER_GROUP: moderation-worker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ARTIFACT_ROOT: /mlruns
      MLFLOW_EXPERIMENT_NAME: moderation-model-1
      MLFLOW_MODEL_NAME: moderation-model
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./mlruns:/mlruns
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003

  worker:
    build: .
    environment:
      USE_MLFLOW: "true"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: moderation
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP: redpanda:29092
      TOPIC: moderation
      DLQ_TOPIC: moderation_dlq
      CONSUMER_GROUP: moderation-worker
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: python -m app.workers.moderation_worker

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  redpanda_data:
    driver: local
  redis_data:
    driver: local